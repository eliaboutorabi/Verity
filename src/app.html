<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			/*
			 * Resolve the theme before the first paint.
			 *
			 * The stylesheet keys off `data-theme` alone, so "system" has to be
			 * turned into a real answer here; doing it in the app instead means a
			 * white page flashes at anyone who reads in the dark.
			 */
			(() => {
				let stored = null;
				try {
					stored = localStorage.getItem('regassist.theme');
				} catch {}
				const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme =
					stored === 'dark' || stored === 'light' ? stored : system;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
